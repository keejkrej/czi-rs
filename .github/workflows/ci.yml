name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Cache OME Fixtures
        id: cache-fixtures
        uses: actions/cache@v4
        with:
          path: tests/fixtures
          key: ${{ runner.os }}-czi-ome-fixtures-${{ hashFiles('scripts/download_ome_fixtures.sh') }}

      - name: Download OME Test Fixtures
        if: steps.cache-fixtures.outputs.cache-hit != 'true'
        shell: bash
        run: ./scripts/download_ome_fixtures.sh

      - name: Build
        run: cargo build --verbose

      - name: Test (Unit, Integration, Doctests)
        run: cargo test --verbose

  lint:
    name: Clippy & Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Documentation
        run: cargo doc --no-deps
