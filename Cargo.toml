[package]
name = "czi"
version = "1.0.0"
edition = "2021"
rust-version = "1.74"
description = "Fast, memory-efficient, pure Rust reader for Zeiss CZI microscopy files"
license = "MIT OR Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/czi"
repository = "https://github.com/keejkrej/czi-rs"
keywords = ["microscopy", "czi", "zeiss", "bioimaging", "image"]
categories = ["science", "multimedia::images", "parser-implementations"]
include = [
    "src/**/*",
    "tests/*.rs",
    "examples/**/*",
    "scripts/**/*",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
]

[dependencies]
roxmltree = "0.20"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
zstd = "0.13"
